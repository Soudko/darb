    <g clip-path="url(#roadClip)"><use href="#road" fill="none" stroke="url(#spec)" stroke-width="12"/></g>
    <use href="#pin" fill="url(#pinFill)"/>
    <g clip-path="url(#pinClip)"><use href="#pin" fill="none" stroke="url(#pinEdge)" stroke-width="12"/></g>
