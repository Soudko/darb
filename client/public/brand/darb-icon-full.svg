      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="pinEdge" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="580">
      <stop offset="0" stop-color="#8FB3CC" stop-opacity="0"/>
      <stop offset="1" stop-color="#8FB3CC" stop-opacity="0.9"/>
    </linearGradient>
    <path id="road" d="M668 487 C590 492 528 515 533 550 C538 580 640 592 740 610 C860 632 915 665 912 705 C908 760 800 805 690 855 C590 900 530 960 495 998 C470 1022 400 1020 345 1000 C290 978 270 930 300 875 C330 820 430 790 560 765 C660 745 738 728 736 695 C734 668 660 655 560 642 C470 630 418 610 422 570 C426 520 540 492 668 487Z"/>
    <path id="pin" fill-rule="evenodd" clip-rule="evenodd" d="M680 431 A123 123 0 1 1 882 431 C854 471 812 532 796 557 Q781 584 766 557 C750 532 708 471 680 431Z M836 362 A55 55 0 1 0 726 362 A55 55 0 1 0 836 362Z"/>
    <clipPath id="roadClip"><path d="M668 487 C590 492 528 515 533 550 C538 580 640 592 740 610 C860 632 915 665 912 705 C908 760 800 805 690 855 C590 900 530 960 495 998 C470 1022 400 1020 345 1000 C290 978 270 930 300 875 C330 820 430 790 560 765 C660 745 738 728 736 695 C734 668 660 655 560 642 C470 630 418 610 422 570 C426 520 540 492 668 487Z"/></clipPath>
    <clipPath id="pinClip"><path clip-rule="evenodd" d="M680 431 A123 123 0 1 1 882 431 C854 471 812 532 796 557 Q781 584 766 557 C750 532 708 471 680 431Z M836 362 A55 55 0 1 0 726 362 A55 55 0 1 0 836 362Z"/></clipPath>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
