<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t">
  <title id="t">Darb</title>
  <!-- Full-bleed square for iPhone "Add to Home Screen" (apple-touch-icon) and app stores: the system rounds the corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5597"/>
      <stop offset="0.55" stop-color="#0B2D5B"/>
      <stop offset="1" stop-color="#071F44"/>
    </linearGradient>
    <radialGradient id="bgLight" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadFill" gradientUnits="userSpaceOnUse" x1="330" y1="1000" x2="668" y2="487">
      <stop offset="0" stop-color="#00B5B8"/>
      <stop offset="0.5" stop-color="#6ED9D1"/>
      <stop offset="1" stop-color="#F4F8FB"/>
    </linearGradient>
    <linearGradient id="pinFill" x1="0" y1="0" x2="0" y2="1">
